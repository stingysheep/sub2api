name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      migration-fixture:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: migration_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:25433:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUB2API_MIGRATIONS_LOCAL_TEST: '1'
      BILLING_TEST_POSTGRES_LOCAL: '127.0.0.1:25433'
      SUB2API_BACKLOG_LOCAL_TEST: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint, typecheck and full vitest
        run: make test-frontend
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/operator-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.60.0
          node "$RUNNER_TEMP/operator-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Operator browser tests with loopback fixtures
        working-directory: frontend
        env:
          PLAYWRIGHT_CORE_PATH: ${{ runner.temp }}/operator-browser/node_modules/playwright-core
        run: node scripts/operator-browser-smoke.mjs

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
